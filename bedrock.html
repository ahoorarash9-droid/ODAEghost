<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODAEghost | Bedrock Mods</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, rgba(151,255,0,.08), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(120,70,255,.12), transparent 30%),
        #070910;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================
       PROFESSIONAL ANIMATIONS
    ========================= */

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes navIn {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glow {
      0%, 100% {
        opacity: .45;
        transform: scale(1);
      }

      50% {
        opacity: .9;
        transform: scale(1.15);
      }
    }

    @keyframes badgePulse {
      0%, 100% {
        box-shadow: 0 0 15px rgba(168,255,0,.04);
      }

      50% {
        box-shadow: 0 0 35px rgba(168,255,0,.18);
      }
    }

    @keyframes titleGlow {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(168,255,0,.12));
      }

      50% {
        filter: drop-shadow(0 0 25px rgba(168,255,0,.32));
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes imageZoom {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.07);
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-130%) skewX(-20deg);
      }

      100% {
        transform: translateX(230%) skewX(-20deg);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes footerIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      animation: pageIn .7s ease both;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 6%;

      background: rgba(7,9,16,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,.07);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;

      animation: navIn .7s ease both;
    }

    nav a {
      color: #aeb4c2;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;

      transition:
        color .3s,
        transform .3s,
        text-shadow .3s;

      position: relative;
      padding: 5px 2px;
    }

    nav a::after {
      content: "";

      position: absolute;
      right: 50%;
      bottom: -5px;

      width: 0;
      height: 2px;

      background: #a8ff00;

      transform: translateX(50%);

      transition: width .3s;

      box-shadow: 0 0 10px rgba(168,255,0,.7);
    }

    nav a:hover {
      color: #a8ff00;
      transform: translateY(-3px);
      text-shadow: 0 0 15px rgba(168,255,0,.6);
    }

    nav a:hover::after {
      width: 75%;
    }

    /* =========================
       HERO
    ========================= */

    .hero {width: 90%;
      max-width: 1200px;
      margin: 70px auto 40px;
      text-align: center;
      position: relative;
      animation: heroIn 1s .1s ease both;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 420px;

      left: 50%;
      top: -130px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: rgba(156,255,0,.07);

      filter: blur(100px);

      pointer-events: none;

      animation: glow 5s ease-in-out infinite;
    }

    .badge {
      position: relative;

      display: inline-block;

      padding: 8px 16px;

      border-radius: 999px;

      color: #b7ff39;

      background: rgba(156,255,0,.08);

      border: 1px solid rgba(156,255,0,.2);

      font-size: 13px;

      margin-bottom: 20px;

      animation: badgePulse 3s ease-in-out infinite;
    }

    .hero h1 {
      position: relative;

      margin: 0;

      font-size: clamp(38px,7vw,75px);

      font-weight: 900;

      background: linear-gradient(
        90deg,
        #a8ff00,
        #d8ff9a,
        #8f5cff,
        #a8ff00
      );

      background-size: 300% 100%;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        titleGlow 3s ease-in-out infinite,
        gradientMove 7s linear infinite;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 300% 50%;
      }
    }

    .hero p {
      position: relative;

      max-width: 650px;

      margin: 20px auto 0;

      color: #8e96a7;

      line-height: 2;

      font-size: 15px;

      animation: heroIn 1s .35s ease both;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      display: grid;

      grid-template-columns: 1fr 220px;

      gap: 14px;

      margin: 40px 0;

      animation: heroIn .8s .45s ease both;
    }

    .input-box {
      position: relative;
    }

    input,
    select {
      width: 100%;

      padding: 15px 18px;

      border-radius: 14px;

      border: 1px solid rgba(255,255,255,.08);

      background: rgba(17,21,32,.8);

      color: #fff;

      outline: none;

      font-size: 14px;

      transition:
        border-color .3s,
        box-shadow .3s,
        transform .3s;
    }

    input:hover,
    select:hover {
      transform: translateY(-2px);
    }

    input::placeholder {
      color: #697184;
    }

    input:focus,
    select:focus {
      border-color: rgba(156,255,0,.5);

      box-shadow:
        0 0 25px rgba(156,255,0,.08),
        0 0 5px rgba(156,255,0,.2);

      transform: translateY(-2px);
    }

    select option {
      background: #111520;
      color: white;
    }

    /* =========================
       STATUS
    ========================= */

    .message {
      text-align: center;

      color: #737b8e;

      margin: 30px 0;

      min-height: 25px;

      animation: float 3s ease-in-out infinite;
    }

    /* =========================
       MOD GRID
    ========================= */

    .mods {
      display: grid;

      grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

      gap: 22px;

      padding-bottom: 70px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.015)
        );

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 22px;

      padding: 24px;

      backdrop-filter: blur(15px);

      box-shadow:
        0 15px 50px rgba(0,0,0,.25);

      transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        border-color .35s,
        box-shadow .35s;

      animation: cardIn .7s ease both;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      top: -80px;
      right: -60px;

      background: #9cff00;

      opacity: .08;

      filter: blur(50px);

      border-radius: 50%;

      transition:
        transform .5s,
        opacity .5s;
    }

    .card::after {
      content: "";

      position: absolute;

      width: 100%;
      height: 1px;

      top: 0;
      left: -100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(168,255,0,.7),
        transparent
      );

      transition: left .7s;
    }

    .card:hover {
      transform:
        translateY(-10px)
        scale(1.015);

      border-color: rgba(156,255,0,.3);

      box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        0 0 30px rgba(156,255,0,.08);
    }

    .card:hover::before {
      transform: scale(1.5);
      opacity: .16;
    }

    .card:hover::after {
      left: 100%;
    }

    /* =========================
       IMAGE
    ========================= */

    .mod-image {
      width: 100%;

      height: 170px;

      object-fit: cover;

      border-radius: 15px;

      margin-bottom: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(156,255,0,.08),
          rgba(120,70,255,.12)
        );

      border: 1px solid rgba(255,255,255,.06);

      transition:
        transform .6s cubic-bezier(.2,.8,.2,1),
        filter .4s;
    }

    .card:hover .mod-image {
      transform: scale(1.045);
      filter: brightness(1.08);
    }

    .no-image {
      height: 170px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 15px;

      margin-bottom: 20px;

      color: #70788b;

      background:
        linear-gradient(
          135deg,
          rgba(156,255,0,.05),
          rgba(120,70,255,.08)
        );

      border: 1px solid rgba(255,255,255,.06);

      transition:
        transform .4s,
        border-color .4s,
        box-shadow .4s;
    }

    .card:hover .no-image {
      transform: scale(1.025);
      border-color: rgba(156,255,0,.18);
      box-shadow: inset 0 0 30px rgba(156,255,0,.04);
    }

    .card h2 {
      margin: 0 0 10px;

      font-size: 21px;

      color: #fff;

      transition:
        color .3s,
        transform .3s;
    }

    .card:hover h2 {
      color: #a8ff00;
      transform: translateX(-3px);
    }

    .version {
      display: inline-block;

      padding: 6px 10px;

      border-radius: 8px;

      background: rgba(156,255,0,.08);

      border: 1px solid rgba(156,255,0,.12);

      color: #aaff1a;

      font-size: 12px;

      margin-bottom: 15px;

      transition:
        transform .3s,
        box-shadow .3s;
    }

    .card:hover .version {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(156,255,0,.08);
    }

    .description {
      color: #9ba3b3;

      line-height: 1.9;

      font-size: 14px;

      min-height: 78px;
    }

    /* =========================
       DOWNLOAD
    ========================= */

    .download {
      display: flex;

      align-items: center;
      justify-content: center;

      margin-top: 20px;

      padding: 13px 18px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #9cff00,
          #72c900
        );

      color: #081000;

      text-decoration: none;

      font-weight: 900;

      position: relative;

      overflow: hidden;

      transition:
        transform .3s,
        box-shadow .3s;
    }

    .download::before {
      content: "";

      position: absolute;

      top: 0;
      left: -130%;

      width: 55%;
      height: 100%;

      background: rgba(255,255,255,.4);

      transform: skewX(-20deg);
    }

    .download:hover::before {
      animation: shine .7s ease;
    }

    .download:hover {
      transform:
        translateY(-4px)
        scale(1.02);

      box-shadow:
        0 12px 30px rgba(156,255,0,.25);
    }

    .download:active {
      transform: scale(.97);
    }

    /*=========================
       FOOTER
    ========================= */

    footer {
      padding: 30px;

      text-align: center;

      color: #555d6d;

      border-top:
        1px solid rgba(255,255,255,.06);

      font-size: 13px;

      animation: footerIn 1s ease both;
    }

    footer:hover {
      color: #7f8999;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      nav {
        gap: 15px;
        padding: 14px;
      }

      .hero {
        margin-top: 45px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .mods {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      .hero::before {
        width: 280px;
        height: 280px;
      }

      .card:hover {
        transform: translateY(-6px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }

    }

  </style>
</head>

<body>

  <!-- NAV -->

  <nav>
    <a href="index.html">خانه</a>
    <a href="java.html">Java Mods</a>
    <a href="bedrock.html">Bedrock Mods</a>
    <a href="news.html">اخبار</a>
    <a href="admin.html">Admin</a>
  </nav>


  <!-- HERO -->

  <section class="hero">

    <div class="badge">
      ODAEGHOST • BEDROCK
    </div>

    <h1>
      Bedrock Mods
    </h1>

    <p>
      بهترین Add-on های Minecraft Bedrock را پیدا کن،
      نسخه موردنظرت را انتخاب کن و مستقیماً دانلود کن.
    </p>

  </section>


  <!-- CONTENT -->

  <main class="container">

    <!-- FILTERS -->

    <div class="filters">

      <div class="input-box">

        <input
          type="text"
          id="search"
          placeholder="🔍 جستجوی Add-on..."
        >

      </div>

      <select id="version">

        <option value="">
          همه نسخه‌ها
        </option>

      </select>

    </div>


    <!-- STATUS -->

    <div id="message" class="message">
      در حال بارگذاری Add-on ها...
    </div>


    <!-- MODS -->

    <div id="mods" class="mods"></div>

  </main>


  <footer>
    ©️ 2026 ODAEghost — Minecraft Bedrock Mods
  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <script>

    let allMods = [];


    async function loadMods() {

      const message =
        document.getElementById("message");

      try {

        const { data, error } =
          await supabaseClient
            .from("bedrock_mods")
            .select("*")
            .order("created_at", {
              ascending: false
            });


        if (error) {

          console.error(error);

          message.textContent =
            "خطا در دریافت Add-on ها";

          return;
        }


        allMods = data || [];

        createVersions();

        renderMods(allMods);

      }

      catch (error) {

        console.error(error);

        message.textContent =
          "خطایی در اتصال به سرور رخ داد.";

      }

    }


    function createVersions() {

      const versionSelect =
        document.getElementById("version");

      const versions =
        [
          ...new Set(
            allMods
              .map(mod => mod.minecraft_version)
              .filter(Boolean)
          )
        ];


      versions.forEach(version => {

        const option =
          document.createElement("option");

        option.value = version;

        option.textContent =
          "Minecraft " + version;

        versionSelect.appendChild(option);

      });

    }


    function renderMods(mods) {

      const container =
        document.getElementById("mods");

      const message =
        document.getElementById("message");


      container.innerHTML = "";


      if (!mods.length) {

        message.textContent =
          "هنوز هیچ Add-on ای اضافه نشده.";

        return;
      }


      message.textContent = "";


      mods.forEach((mod, index) => {

        const card =
          document.createElement("article");

        card.className = "card";

        card.style.animationDelay =
          `${Math.min(index * 0.08, 0.5)}s`;


        let imageHTML = "";


        if (mod.image_url) {

          imageHTML = `
            <img
              class="mod-image"
              src="${escapeHtml(mod.image_url)}"
              alt="${escapeHtml(mod.name)}"
              loading="lazy"
            >
          `;

        }

        else {

          imageHTML = `
            <div class="no-image">
              🧩 Bedrock Add-on
            </div>
          `;

        }


        card.innerHTML = `

          ${imageHTML}

          <h2>
            ${escapeHtml(mod.name)}
          </h2>

          <div class="version">
            Minecraft ${escapeHtml(
              mod.minecraft_version || "نامشخص"
            )}
          </div>

          <div class="description">
            ${escapeHtml(
              mod.description ||
              "توضیحی برای این Add-on ثبت نشده است."
            )}
          </div>

          <a
            class="download"
            href="${escapeHtml(mod.download_url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ⬇️ دانلود Add-on
          </a>

        `;


        container.appendChild(card);

      });

    }


    function filterMods() {

      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const version =
        document.getElementById("version").value;


      const filtered =
        allMods.filter(mod => {

          const name =
            (mod.name || "").toLowerCase();

          const description =
            (mod.description || "").toLowerCase();


          const matchesSearch =
            name.includes(search) ||
            description.includes(search);


          const matchesVersion =
            !version ||
            mod.minecraft_version === version;


          return (
            matchesSearch &&
            matchesVersion
          );

        });


      renderMods(filtered);

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text ?? "";

      return div.innerHTML;

    }


    document
      .getElementById("search")
      .addEventListener(
        "input",
        filterMods
      );


    document
      .getElementById("version")
      .addEventListener(
        "change",
        filterMods
      );


    loadMods();

  </script>

</body>
</html>
