<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODAEghost | News</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(156, 255, 0, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(120, 70, 255, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(0, 210, 255, 0.07),
          transparent 30%
        ),
        #070910;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );
    }

    /* =========================
       NAV
    ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      padding: 16px 6%;

      background: rgba(7, 9, 16, 0.72);
      backdrop-filter: blur(22px);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;

      animation: navDrop 0.8s ease both;
    }

    nav::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 15%;
      width: 70%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(156,255,0,0.5),
        rgba(120,70,255,0.6),
        transparent
      );

      animation: navGlow 3s ease-in-out infinite;
    }

    nav a {
      position: relative;

      color: #aeb4c2;
      text-decoration: none;

      font-size: 14px;
      font-weight: bold;

      padding: 7px 2px;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    nav a::before {
      content: "";
      position: absolute;

      bottom: 0;
      right: 50%;

      width: 0;
      height: 2px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #a8ff00,
          #8f5cff
        );

      transition:
        width 0.3s ease,
        right 0.3s ease;
    }

    nav a:hover {
      color: #fff;
      transform: translateY(-2px);

      text-shadow:
        0 0 15px rgba(168,255,0,0.55);
    }

    nav a:hover::before {
      width: 100%;
      right: 0;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 90%;
      max-width: 1100px;

      margin: 75px auto 45px;

      text-align: center;

      animation: heroReveal 1s ease both;
    }

    .hero::before {
      content: "";

      position: absolute;
      top: 30%;
      left: 50%;

      width: 280px;
      height: 280px;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          circle,
          rgba(156,255,0,0.09),
          transparent 65%
        );

      filter: blur(15px);

      z-index: -1;

      animation: pulseGlow 4s ease-in-out infinite;
    }

    .badge {
      display: inline-block;

      padding: 9px 18px;

      border-radius: 999px;

      color: #caff62;

      background:
        rgba(156,255,0,0.07);

      border:
        1px solid rgba(156,255,0,0.23);

      font-size: 13px;

      margin-bottom: 20px;

      box-shadow:
        0 0 25px rgba(156,255,0,0.05);

      animation:
        badgeFloat 3s ease-in-out infinite;
    }.hero h1 {
      margin: 0;

      font-size:
        clamp(46px, 8vw, 82px);

      font-weight: 900;
      letter-spacing: -2px;

      background:
        linear-gradient(
          90deg,
          #a8ff00,
          #e6ffb8,
          #8f5cff,
          #a8ff00
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        gradientMove 5s linear infinite;
    }

    .hero p {
      max-width: 680px;

      margin: 20px auto 0;

      color: #8e96a7;

      line-height: 2;

      font-size: 15px;

      animation:
        fadeUp 1s ease 0.3s both;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      position: relative;

      margin: 45px 0 30px;

      animation:
        fadeUp 0.8s ease 0.4s both;
    }

    .search-box::before {
      content: "⌕";

      position: absolute;

      right: 18px;
      top: 50%;

      transform: translateY(-50%);

      color: #a8ff00;

      font-size: 22px;

      pointer-events: none;

      z-index: 2;

      transition: 0.3s;
    }

    #search {
      width: 100%;

      padding: 17px 52px 17px 20px;

      border-radius: 17px;

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        linear-gradient(
          135deg,
          rgba(17,21,32,0.88),
          rgba(12,15,25,0.78)
        );

      color: white;

      outline: none;

      font-size: 14px;

      box-shadow:
        0 12px 40px rgba(0,0,0,0.18);

      transition:
        border-color 0.3s,
        box-shadow 0.3s,
        transform 0.3s;
    }

    #search::placeholder {
      color: #697184;
    }

    #search:focus {
      border-color:
        rgba(156,255,0,0.5);

      box-shadow:
        0 0 0 4px rgba(156,255,0,0.04),
        0 15px 50px rgba(0,0,0,0.28);

      transform: translateY(-2px);
    }

    #search:focus + * {
      color: #a8ff00;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      text-align: center;

      color: #737b8e;

      margin: 25px 0;

      min-height: 25px;

      font-size: 14px;

      animation:
        messagePulse 1.8s ease-in-out infinite;
    }

    /* =========================
       NEWS GRID
    ========================= */

    .news {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(310px, 1fr));

      gap: 25px;

      padding-bottom: 80px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.012)
        );

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 23px;

      backdrop-filter: blur(18px);

      box-shadow:
        0 15px 50px rgba(0,0,0,0.25);

      opacity: 0;
      transform:
        translateY(35px)
        scale(0.97);

      animation:
        cardReveal 0.7s cubic-bezier(.2,.8,.2,1)
        forwards;

      transition:
        transform 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          100deg,
          transparent,
          rgba(255,255,255,0.07),
          transparent
        );

      transform: skewX(-18deg);

      transition: left 0.8s ease;

      z-index: 2;

      pointer-events: none;
    }

    .card::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: inherit;

      padding: 1px;

      background:
        linear-gradient(
          135deg,
          rgba(156,255,0,0.0),
          rgba(120,70,255,0.0)
        );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;

      pointer-events: none;

      transition: 0.4s;
    }

    .card:hover {
      transform:
        translateY(-10px)
        scale(1.015);

      border-color:
        rgba(156,255,0,0.28);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.45),
        0 0 30px rgba(156,255,0,0.05);
    }

    .card:hover::before {
      left: 140%;
    }

    .card:hover::after {
      background:
        linear-gradient(
          135deg,
          rgba(156,255,0,0.45),
          rgba(120,70,255,0.4)
        );
    }

    /* =========================
       IMAGE
    ========================= */

    .news-image {
      width: 100%;
      height: 210px;

      object-fit: cover;

      display: block;

      background:
        linear-gradient(
          135deg,
          rgba(156,255,0,0.08),
          rgba(120,70,255,0.12)
        );

      transition:
        transform 0.7s cubic-bezier(.2,.8,.2,1),
        filter 0.5s ease;
    }

    .card:hover .news-image {
      transform: scale(1.07);

      filter:
        brightness(1.08)
        saturate(1.1);
    }

    .no-image {
      height: 210px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #70788b;

      font-size: 16px;

      background:
        radial-gradient(
          circle at center,
          rgba(156,255,0,0.10),
          transparent 50%
        ),
        linear-gradient(
          135deg,
          rgba(156,255,0,0.05),
          rgba(120,70,255,0.08)
        );

      transition:
        transform 0.5s ease,
        color 0.3s;
    }

    .card:hover .no-image {
      color: #a8ff00;
      transform: scale(1.03);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      padding: 23px;
    }

    .date {
      display: inline-flex;

      align-items: center;

      color: #a8ff00;

      font-size: 12px;

      margin-bottom: 12px;

      padding: 6px 10px;

      border-radius: 8px;

      background:
        rgba(156,255,0,0.06);

      border:
        1px solid rgba(156,255,0,0.09);
    }

    .content h2 {
      margin: 0 0 14px;

      font-size: 21px;

      line-height: 1.6;

      color: #fff;

      transition:
        color 0.3s,
        transform 0.3s;
    }

    .card:hover .content h2 {
      color: #dfff9a;
      transform: translateX(-3px);
    }

    .content p {
      color: #9ba3b3;

      font-size: 14px;

      line-height: 2;

      white-space: pre-line;

      margin-bottom: 0;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      position: relative;

      padding: 35px 20px;

      text-align: center;

      color: #555d6d;

      border-top:
        1px solid rgba(255,255,255,0.06);

      font-size: 13px;

      background:
        rgba(5,7,12,0.45);

      overflow: hidden;
    }

    footer::before {
      content: "";

      position: absolute;

      top: 0;
      left: 50%;

      width: 180px;
      height: 1px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          #a8ff00,
          #8f5cff,
          transparent
        );

      box-shadow:
        0 0 20px rgba(168,255,0,0.4);
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes navDrop {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes navGlow {
      0%,100% {
        opacity: 0.4;
        transform: scaleX(0.8);
      }

      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes heroReveal {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }@keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes badgeFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes pulseGlow {
      0%,100% {
        transform:
          translate(-50%, -50%)
          scale(0.9);

        opacity: 0.5;
      }

      50% {
        transform:
          translate(-50%, -50%)
          scale(1.1);

        opacity: 1;
      }
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 250% center;
      }
    }

    @keyframes cardReveal {
      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes messagePulse {
      0%,100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      nav {
        gap: 14px;
        padding: 14px 10px;
      }

      nav a {
        font-size: 12px;
      }

      .hero {
        margin-top: 48px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 13px;
      }

      .news {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .card {
        border-radius: 20px;
      }

      .news-image,
      .no-image {
        height: 190px;
      }

      .content {
        padding: 20px;
      }

      .content h2 {
        font-size: 19px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

    }

  </style>

</head>

<body>

  <!-- NAV -->

  <nav>

    <a href="index.html">خانه</a>

    <a href="java.html">Java Mods</a>

    <a href="bedrock.html">Bedrock Mods</a>

    <a href="news.html">اخبار</a>

    <a href="admin.html">Admin</a>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <div class="badge">
      ⚡ ODAEghost • NEWS
    </div>

    <h1>
      News
    </h1>

    <p>
      آخرین اخبار، آپدیت‌ها و اتفاقات
      مربوط به Minecraft و ODAEghost.
    </p>

  </section>


  <!-- CONTENT -->

  <main class="container">

    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="جستجوی خبر..."
      >

    </div>


    <!-- STATUS -->

    <div
      id="message"
      class="message"
    >
      در حال بارگذاری اخبار...
    </div>


    <!-- NEWS -->

    <div
      id="news"
      class="news"
    ></div>

  </main>


  <!-- FOOTER -->

  <footer>

    © 2026 ODAEghost — Minecraft News

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <script>

    let allNews = [];


    /* =========================
       LOAD NEWS
    ========================= */

    async function loadNews() {

      const message =
        document.getElementById("message");

      try {

        const { data, error } =
          await supabaseClient

            .from("news")

            .select("*")

            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          console.error(error);

          message.textContent =
            "خطا در دریافت اخبار.";

          return;

        }


        allNews = data || [];

        renderNews(allNews);

      }

      catch (error) {

        console.error(error);

        message.textContent =
          "خطایی در اتصال به سرور رخ داد.";

      }

    }


    /* =========================
       RENDER NEWS
    ========================= */

    functionrenderNews(newsList) {

      const container =
        document.getElementById("news");

      const message =
        document.getElementById("message");


      container.innerHTML = "";


      if (!newsList.length) {

        message.textContent =
          "هنوز هیچ خبری منتشر نشده است.";

        return;

      }


      message.textContent = "";


      newsList.forEach((item, index) => {

        const card =
          document.createElement("article");


        card.className = "card";


        /* ANIMATION DELAY */

        card.style.animationDelay =
          `${index * 0.08}s`;


        let imageHTML = "";


        if (item.image_url) {

          imageHTML = `

            <img

              class="news-image"

              src="${escapeHtml(
                item.image_url
              )}"

              alt="${escapeHtml(
                item.title
              )}"

              loading="lazy"

            >

          `;

        }

        else {

          imageHTML = `

            <div class="no-image">

              📰 ODAEghost News

            </div>

          `;

        }


        const date =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleDateString(
                "fa-IR"
              )
            : "";


        card.innerHTML = `

          ${imageHTML}

          <div class="content">

            <div class="date">

              📅 ${escapeHtml(date)}

            </div>

            <h2>

              ${escapeHtml(
                item.title
              )}

            </h2>

            <p>

              ${escapeHtml(
                item.content
              )}

            </p>

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================
       SEARCH
    ========================= */

    function filterNews() {

      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const filtered =
        allNews.filter(item => {

          const title =
            (
              item.title || ""
            ).toLowerCase();


          const content =
            (
              item.content || ""
            ).toLowerCase();


          return (
            title.includes(search) ||
            content.includes(search)
          );

        });


      renderNews(filtered);

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");


      div.textContent =
        text ?? "";


      return div.innerHTML;

    }


    /* =========================
       SEARCH EVENT
    ========================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        filterNews
      );


    /* =========================
       START
    ========================= */

    loadNews();

  </script>

</body>

</html>
