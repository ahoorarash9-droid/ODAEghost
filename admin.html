<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | ODAEghost</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(0,255,136,.11),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(130,70,255,.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(0,200,255,.07),
          transparent 30%
        ),
        #070910;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;
      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 90%
        );
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      position: relative;
    }

    #loginPage::before {
      content: "";
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,255,136,.12),
          transparent 68%
        );

      filter: blur(20px);

      animation:
        loginGlow 5s ease-in-out infinite;

      pointer-events: none;
    }

    .login-box {
      width: 100%;
      max-width: 450px;

      padding: 38px;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(18,25,37,.88),
          rgba(10,14,22,.82)
        );

      border:
        1px solid rgba(255,255,255,.09);

      box-shadow:
        0 0 70px rgba(0,255,140,.07),
        0 25px 80px rgba(0,0,0,.45);

      backdrop-filter: blur(24px);

      position: relative;
      overflow: hidden;

      animation:
        loginReveal .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .login-box::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 70%;
      height: 100%;

      background:
        linear-gradient(
          100deg,
          transparent,
          rgba(255,255,255,.045),
          transparent
        );

      transform: skewX(-18deg);

      animation:
        loginShine 5s ease-in-out infinite;
    }

    .login-box::after {
      content: "";

      position: absolute;

      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #00ff88,
          #8f5cff,
          transparent
        );

      box-shadow:
        0 0 25px rgba(0,255,136,.45);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -1px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #baffd9,
          #8f5cff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        logoPulse 3s ease-in-out infinite;
    }

    .logo span {
      color: #00ff88;
      -webkit-text-fill-color: #00ff88;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
      font-size: 14px;}

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;

      padding: 14px 15px;

      border-radius: 13px;

      border:
        1px solid #252d3a;

      background:
        rgba(7,12,19,.85);

      color: white;

      outline: none;

      margin-bottom: 17px;

      font-size: 14px;

      transition:
        border-color .3s,
        box-shadow .3s,
        transform .3s,
        background .3s;
    }

    input:hover,
    textarea:hover,
    select:hover {
      border-color:
        rgba(0,255,136,.25);
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #00ff88;

      box-shadow:
        0 0 0 3px rgba(0,255,136,.07),
        0 0 25px rgba(0,255,136,.06);

      background:
        rgba(8,15,23,.95);

      transform: translateY(-1px);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.8;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      color: white;
      font-weight: bold;

      transition:
        transform .25s,
        box-shadow .25s,
        filter .25s,
        opacity .25s;
    }

    button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(0) scale(.98);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .btn-primary {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          #00ff88,
          #00c96b
        );

      color: #03140c;

      box-shadow:
        0 10px 30px rgba(0,255,136,.14);
    }

    .btn-primary:hover {
      box-shadow:
        0 14px 40px rgba(0,255,136,.24);
    }

    .btn-green {
      background:
        linear-gradient(
          135deg,
          #00ed7d,
          #00b961
        );

      color: #04140c;

      box-shadow:
        0 8px 25px rgba(0,255,136,.10);
    }

    .btn-blue {
      background:
        linear-gradient(
          135deg,
          #6673ff,
          #4d57d8
        );
    }

    .btn-red {
      background:
        linear-gradient(
          135deg,
          #ff5252,
          #d93636
        );
    }

    .btn-gray {
      background:
        linear-gradient(
          135deg,
          #344052,
          #252e3c
        );
    }

    .status {
      padding: 12px;
      border-radius: 11px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
      animation:
        statusReveal .35s ease both;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background:
        rgba(0,255,136,.08);

      border:
        1px solid rgba(0,255,136,.25);

      color: #5dffad;
    }

    .status.error {
      background:
        rgba(255,60,60,.08);

      border:
        1px solid rgba(255,60,60,.25);

      color: #ff8d8d;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminPage {
      padding-bottom: 60px;
      animation:
        pageReveal .7s ease both;
    }

    header {
      border-bottom:
        1px solid rgba(255,255,255,.07);

      background:
        rgba(7,10,16,.72);

      backdrop-filter: blur(20px);

      position: sticky;
      top: 0;
      z-index: 100;

      animation:
        headerDrop .7s ease both;
    }

    header::after {
      content: "";

      position: absolute;

      bottom: -1px;
      left: 15%;

      width: 70%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,255,136,.55),
          rgba(130,70,255,.55),
          transparent
        );

      animation:
        linePulse 4s ease-in-out infinite;
    }

    .nav {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 900;background:
        linear-gradient(
          90deg,
          #fff,
          #a9ffd1,
          #8f5cff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand span {
      color: #00ff88;
      -webkit-text-fill-color: #00ff88;
    }

    .logout {
      background:
        linear-gradient(
          135deg,
          #ef4444,
          #c72e2e
        );

      box-shadow:
        0 8px 25px rgba(239,68,68,.10);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 60px 0 35px;
      animation:
        fadeUp .8s ease .15s both;
    }

    .hero h1 {
      font-size:
        clamp(28px, 5vw, 48px);

      margin-bottom: 12px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #aaffd0,
          #9b6cff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #9ca3af;
      line-height: 1.8;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 30px;
      padding: 26px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(15,20,30,.82),
          rgba(10,14,22,.74)
        );

      border:
        1px solid rgba(255,255,255,.07);

      box-shadow:
        0 18px 60px rgba(0,0,0,.20);

      backdrop-filter: blur(15px);

      position: relative;
      overflow: hidden;

      animation:
        sectionReveal .8s ease both;
    }

    .section::before {
      content: "";

      position: absolute;

      top: 0;
      right: 8%;

      width: 84%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,255,136,.35),
          rgba(130,70,255,.35),
          transparent
        );
    }

    .section::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      left: -100px;
      bottom: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(130,70,255,.08),
          transparent 70%
        );

      pointer-events: none;
    }

    .section:nth-of-type(2) {
      animation-delay: .1s;
    }

    .section:nth-of-type(3) {
      animation-delay: .2s;
    }

    .section:nth-of-type(4) {
      animation-delay: .3s;
    }

    .section h2 {
      margin-bottom: 24px;

      color: #00ff88;

      font-size: 21px;

      display: flex;
      align-items: center;
      gap: 8px;

      text-shadow:
        0 0 20px rgba(0,255,136,.12);
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .form-actions button {
      width: auto;
    }

    /* =========================
       FILE
    ========================= */

    .file-box {
      padding: 15px;

      border:
        1px dashed #354052;

      border-radius: 14px;

      margin-bottom: 18px;

      background:
        rgba(255,255,255,.02);

      transition:
        border-color .3s,
        background .3s;
    }

    .file-box:hover {
      border-color:
        rgba(0,255,136,.35);

      background:
        rgba(0,255,136,.02);
    }

    .file-box input {
      margin-bottom: 0;
    }

    .progress {
      width: 100%;
      height: 8px;

      border-radius: 10px;

      background: #1b2330;

      overflow: hidden;

      margin-top: 12px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #00ff88,
          #8f5cff
        );

      transition:
        width .3s ease;

      box-shadow:
        0 0 15px rgba(0,255,136,.4);
    }

    /* =========================
       ITEMS
    ========================= */

    .items {
      display: grid;gap: 12px;
    }

    .item {
      padding: 18px;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(12,17,26,.95),
          rgba(9,13,20,.82)
        );

      border:
        1px solid #202938;

      position: relative;

      overflow: hidden;

      animation:
        itemReveal .5s ease both;

      transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
    }

    .item::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;

      width: 3px;
      height: 0;

      background:
        linear-gradient(
          to bottom,
          #00ff88,
          #8f5cff
        );

      transition:
        height .35s ease;
    }

    .item:hover {
      transform:
        translateX(-4px);

      border-color:
        rgba(0,255,136,.22);

      box-shadow:
        0 12px 35px rgba(0,0,0,.22);
    }

    .item:hover::before {
      height: 100%;
    }

    .item-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .item-info {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.9;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-actions button {
      padding: 8px 13px;
      font-size: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 25px;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 20px;

      animation:
        loadingPulse 1.5s ease-in-out infinite;
    }

    .error-box {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 18px;

      background:
        rgba(24,13,13,.9);

      border:
        1px solid #652222;

      color: #ff9b9b;

      line-height: 1.9;

      animation:
        fadeUp .5s ease both;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes loginReveal {
      from {
        opacity: 0;
        transform:
          translateY(30px)
          scale(.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes loginGlow {
      0%,100% {
        transform: scale(.9);
        opacity: .5;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes loginShine {
      0% {
        left: -100%;
      }

      35%,100% {
        left: 150%;
      }
    }

    @keyframes logoPulse {
      0%,100% {
        filter: drop-shadow(
          0 0 0 rgba(0,255,136,0)
        );
      }

      50% {
        filter: drop-shadow(
          0 0 15px rgba(0,255,136,.15)
        );
      }
    }

    @keyframes statusReveal {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pageReveal {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes headerDrop {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes linePulse {
      0%,100% {
        opacity: .35;
        transform: scaleX(.8);
      }

      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sectionReveal {
      from {
        opacity: 0;
        transform:
          translateY(35px)
          scale(.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes itemReveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loadingPulse {
      0%,100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .container {
        width: 92%;
      }

      .login-box {
        padding: 28px 21px;
        border-radius: 22px;
      }

      .logo {
        font-size: 32px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .section {
        padding: 19px;
        border-radius: 20px;
      }

      .section h2 {
        font-size: 18px;
      }

      .nav {
        min-height: 62px;
      }

      .brand {
        font-size: 19px;
      }

      .logout {
        padding: 9px 13px;
        font-size: 12px;
      }

      .hero {
        padding: 45px 0 25px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .hero p {
        font-size: 13px;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions button {
        width: 100%;
      }

      .item-actions button {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginPage">

    <div class="login-box">

      <div class="logo">
        ODAE<span>ghost</span>
      </div>

      <div class="subtitle">
        ورود امن به پنل مدیریت
      </div>

      <form id="loginForm">

        <label for="email">
          ایمیل
        </label>

        <input
          id="email"
          type="email"
          placeholder="ایمیل ادمین"
          autocomplete="username"
          required
        >

        <label for="password">
          رمز عبور
        </label>

        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button
          id="loginBtn"
          type="submit"
          class="btn-primary"
        >
          ورود به پنل
        </button>

      </form>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

  </div>


  <!-- ADMIN -->

  <div id="adminPage" class="hidden">

    <header>

      <div class="container nav">

        <div class="brand">
          ODAE<span>ghost</span> Admin
        </div>

        <button
          id="logoutBtn"
          class="logout"
        >
          خروج
        </button>

      </div>

    </header>


    <main class="container">

      <section class="hero">

        <h1>
          پنل مدیریت ODAEghost
        </h1>

        <p>
          مدیریت مودهای Java، Bedrock و اخبار سایت
        </p>

      </section>


      <!-- JAVA -->

      <section class="section">

        <h2>
          🟢 مدیریت مودهای Java
        </h2>

        <form id="javaForm">

          <input
            type="hidden"
            id="javaId"
          >

          <div class="grid">

            <div>

              <label>
                نام مود
              </label>

              <input
                id="javaName"
                type="text"
                placeholder="مثلاً Sodium"
                required
              >

            </div>

            <div>

              <label>
                نسخه Minecraft
              </label>

              <input
                id="javaVersion"
                type="text"
                placeholder="مثلاً 1.21.1"
                required
              >

            </div>

            <div>

              <label>
                Mod Loader
              </label>

              <select id="javaLoader">

                <option value="">
                  انتخاب Loader
                </option>

                <option value="Fabric">
                  Fabric
                </option>

                <option value="Forge">
                  Forge
                </option>

                <option value="NeoForge">
                  NeoForge
                </option>

                <option value="Quilt">
                  Quilt
                </option>

              </select>

            </div>

            <div>

              <label>
                لینک دانلود
              </label>

              <input
                id="javaDownload"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>
                فایل مود Java (.jar)
              </label>

              <div class="file-box">

                <input
                  id="javaFile"
                  type="file"
                  accept=".jar"
                >

                <div class="progress">

                  <div
                    id="javaProgressBar"
                    class="progress-bar"
                  ></div>

                </div>

              </div>

            </div>

            <div class="full">

              <label>
                لینک تصویر
              </label>

              <input
                id="javaImage"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>
                توضیحات
              </label>

              <textarea
                id="javaDescription"
                placeholder="توضیحات مود..."
              ></textarea>

            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="btn-green"
              id="javaSubmitBtn"
            >
              افزودن مود Java
            </button>

            <button
              type="button"
              class="btn-gray hidden"
              id="javaCancelBtn"
            >
              لغو ویرایش
            </button>

          </div>

          <div
            id="javaStatus"
            class="status"
          ></div>

        </form>

        <div
          id="javaList"
          class="items"
          style="margin-top:25px"
        ></div>

      </section>


      <!-- BEDROCK -->

      <section class="section">

        <h2>

      message,
      type = "success"

    function hideStatus(element) {

    /* =========================

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        if (!email || !password) {

          showStatus(
            loginStatus,
            "ایمیل و رمز عبور را وارد کن.",
            "error"
          );

          return;
        }

        loginBtn.disabled = true;

        loginBtn.textContent =
          "در حال ورود...";

        hideStatus(loginStatus);

        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email,
                password
              });

          if (error) {

            console.error(
              "LOGIN ERROR:",
              error
            );

            showStatus(
              loginStatus,
              "ورود ناموفق بود: " +
              error.message,
              "error"
            );

            return;
          }

          if (
            !data ||
            !data.user
          ) {

            showStatus(
              loginStatus,
              "ورود انجام نشد.",
              "error"
            );

            return;
          }

          if (
            data.user.id !== ADMIN_UID
          ) {

            await supabaseClient.auth
              .signOut();

            showStatus(
              loginStatus,
              "این حساب دسترسی ادمین ندارد.",
              "error"
            );

            return;
          }

          showAdmin();

        } catch (error) {

          console.error(
            "LOGIN EXCEPTION:",
            error
          );

          showStatus(
            loginStatus,
            "خطای غیرمنتظره هنگام ورود: " +
            error.message,
            "error"
          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "ورود به پنل";

        }

      }
    );

    /* =========================
       FILE UPLOAD
    ========================= */

    async function uploadFile(
      file,
      folder,
      progressBar
    ) {

      if (!file) {
        return null;
      }

      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "-"
        );

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36).substring(2, 8) +
        "-" +
        safeName;

      const path =
        folder +
        "/" +
        fileName;

      progressBar.style.width =
        "30%";

      const {
        error
      } =
        await supabaseClient
          .storage
          .from("mods")
          .upload(
            path,
            file,
            {
              upsert: false
            }
          );

      if (error) {

        progressBar.style.width =
          "0%";

        throw error;
      }

      progressBar.style.width =
        "100%";

      const {
        data
      } =
        supabaseClient
          .storage
          .from("mods")
          .getPublicUrl(path);

      return data.publicUrl;

    }

    async function loadJava() {

      const box =
        document.getElementById(
          "javaList"
        );

      box.innerHTML =
        `<div class="loading">
          در حال بارگذاری مودهای Java...
        </div>`;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("java_mods")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );

      if (error) {

        box.innerHTML =
          `<div class="empty">
            خطا: ${escapeHtml(error.message)}
          </div>`;

        return;
      }

      if (
        !data ||
        data.length === 0
      ) {

        box.innerHTML =
          `<div class="empty">
            هنوز مود Java اضافه نشده.
          </div>`;

        return;
      }

      box.innerHTML = "";

      data.forEach((mod, index) => {

        const item =
          document.createElement(
            "div"
          );

        item.className = "item";

        item.style.animationDelay =
          `${index * .06}s`;

        item.innerHTML = `

          <div class="item-title">
            ${escapeHtml(mod.name)}
          </div>

          <div class="item-info">

            نسخه:
            ${escapeHtml(
              mod.minecraft_version)}

            <br>

            Loader:
            ${escapeHtml(
              mod.loader ||
              "نامشخص"
            )}

            <button
              class="btn-blue"
              onclick="editJava(${mod.id})"

            </button>

              class="btn-red"
              onclick="deleteJava(${mod.id})"
            >
              حذف
            </button>

          </div>
        `;

        box.appendChild(item);

      });

    }

    async function editJava(id) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("java_mods")
          .select("*")
          .eq("id", id)
          .single();

      if (error) {

        alert(
          "خطا: " +
          error.message
        );

        return;
      }

      document.getElementById(
        "javaId"

    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       AUTH CHECK
    ========================= */

    async function checkAuth() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();

        if (error) {

          console.error(
            "SESSION ERROR:",
            error
          );

          showLogin();

          return;
        }

        const session =
          data.session;

        if (!session) {

          showLogin();

          return;
        }

        if (
          session.user.id !==
          ADMIN_UID
        ) {

          await supabaseClient.auth
            .signOut();

          showLogin();

          showStatus(
            loginStatus,
            "این حساب ادمین نیست.",
            "error"
          );

          return;
        }

        showAdmin();

      } catch (error) {

        console.error(
          "AUTH CHECK ERROR:",
          error
        );

        showLogin();

      }

    }


    /* =========================
       AUTH STATE
    ========================= */

    supabaseClient.auth
      .onAuthStateChange(
        function(event, session) {

          console.log(
            "AUTH EVENT:",
            event
          );

          if (!session) {

            showLogin();

            return;
          }

          if (
            session.user.id !==
            ADMIN_UID
          ) {

            showLogin();

            return;}

          showAdmin();

        }
      );


    /* =========================
       START
    ========================= */

    checkAuth();
