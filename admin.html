<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | ModPulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(0,255,140,.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(130,70,255,.12), transparent 30%),
        #080b12;
      color: #fff;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(15, 20, 30, .82);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        0 0 50px rgba(0,255,140,.08),
        0 20px 60px rgba(0,0,0,.4);
      backdrop-filter: blur(20px);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .logo span {
      color: #00ff88;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid #252d3a;
      background: #0d121b;
      color: white;
      outline: none;
      margin-bottom: 17px;
      font-size: 14px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 2px rgba(0,255,136,.08);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #00ff88, #00c96b);
      color: #03140c;
    }

    .btn-green {
      background: #00d979;
      color: #04140c;
    }

    .btn-blue {
      background: #5865f2;
    }

    .btn-red {
      background: #ef4444;
    }

    .btn-gray {
      background: #293241;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(0,255,136,.1);
      border: 1px solid rgba(0,255,136,.25);
      color: #5dffad;
    }

    .status.error {
      background: rgba(255,60,60,.1);
      border: 1px solid rgba(255,60,60,.25);
      color: #ff8d8d;
    }

    /* ADMIN */

    #adminPage {
      padding-bottom: 60px;
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(7,10,16,.75);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
    }

    .brand span {
      color: #00ff88;
    }

    .logout {
      background: #ef4444;
    }

    .hero {
      padding: 55px 0 35px;
    }

    .hero h1 {
      font-size: clamp(28px, 5vw, 46px);
      margin-bottom: 10px;
    }

    .hero p {
      color: #9ca3af;
    }

    .section {
      margin-top: 30px;
      padding: 25px;
      border-radius: 22px;
      background: rgba(15,20,30,.78);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 15px50px rgba(0,0,0,.18);
    }

    .section h2 {
      margin-bottom: 22px;
      color: #00ff88;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .form-actions button {
      width: auto;
    }

    .file-box {
      padding: 15px;
      border: 1px dashed #354052;
      border-radius: 14px;
      margin-bottom: 18px;
      background: rgba(255,255,255,.02);
    }

    .file-box input {
      margin-bottom: 0;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 10px;
      background: #1b2330;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #00ff88;
      transition: width .2s;
    }

    .items {
      display: grid;
      gap: 12px;
    }

    .item {
      padding: 17px;
      border-radius: 15px;
      background: #0c111a;
      border: 1px solid #202938;
    }

    .item-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .item-info {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-actions button {
      padding: 8px 13px;
      font-size: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 25px;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }

    .error-box {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 18px;
      background: #180d0d;
      border: 1px solid #652222;
      color: #ff9b9b;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .section {
        padding: 18px;
      }

      .nav {
        min-height: 62px;
      }

      .brand {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage">

    <div class="login-box">

      <div class="logo">
        Mod<span>Pulse</span>
      </div>

      <div class="subtitle">
        ورود به پنل مدیریت
      </div>

      <form id="loginForm">

        <label for="email">
          ایمیل
        </label>

        <input
          id="email"
          type="email"
          placeholder="ایمیل ادمین"
          autocomplete="username"
          required
        >

        <label for="password">
          رمز عبور
        </label>

        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button
          id="loginBtn"
          type="submit"
          class="btn-primary"
        >
          ورود به پنل
        </button>

      </form>

      <div id="loginStatus" class="status"></div>

    </div>

  </div>


  <!-- ADMIN -->
  <div id="adminPage" class="hidden">

    <header>
      <div class="container nav">

        <div class="brand">
          Mod<span>Pulse</span> Admin
        </div>

        <button
          id="logoutBtn"
          class="logout"
        >
          خروج
        </button>

      </div>
    </header>


    <main class="container">

      <section class="hero">

        <h1>
          پنل مدیریت ModPulse
        </h1>

        <p>
          مدیریت مودهای Java، Bedrock و اخبار سایت
        </p>

      </section>


      <!-- JAVA -->
      <section class="section">

        <h2>
          🟢 مدیریت مودهای Java
        </h2>

        <form id="javaForm">

          <input
            type="hidden"
            id="javaId"
          >

          <div class="grid">

            <div>
              <label>نام مود</label>

              <input
                id="javaName"
                type="text"
                placeholder="مثلاً Sodium"
                required
              >
            </div>

            <div>
              <label>نسخه Minecraft</label>

              <input
                id="javaVersion"
                type="text"
                placeholder="مثلاً 1.21.1"
                required
              >
            </div>

            <div>
              <label>Mod Loader</label>

              <select id="javaLoader">
                <option value="">انتخاب Loader</option>
                <option value="Fabric">Fabric</option>
                <option value="Forge">Forge</option>
                <option value="NeoForge">NeoForge</option>
                <option value="Quilt">Quilt</option>
              </select>
            </div>

            <div>
              <label>لینک دانلود</label>

              <input
                id="javaDownload"
                type="url"
                placeholder="https://..."
              >
            </div>

            <div class="full">

              <label>
                فایل مود Java (.jar)
              </label>

              <div class="file-box">

                <input
                  id="javaFile"
                  type="file"
                  accept=".jar"
                >

                <div class="progress">
                  <div
                    id="javaProgressBar"
                    class="progress-bar"
                  ></div>
                </div>

              </div>

            </div>

            <div class="full">

              <label>لینک تصویر</label>

              <input
                id="javaImage"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>توضیحات</label>

              <textarea
                id="javaDescription"
                placeholder="توضیحات مود..."
              ></textarea>

            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="btn-green"
              id="javaSubmitBtn"
            >
              افزودن مود Java
            </button>

            <button
              type="button"
              class="btn-gray hidden"
              id="javaCancelBtn"
            >
              لغو ویرایش
            </button>

          </div>

          <div
            id="javaStatus"
            class="status"
          ></div>

        </form>

        <div
          id="javaList"
          class="items"
          style="margin-top:25px"
        ></div>

      </section>


      <!-- BEDROCK -->
      <section class="section">

        <h2>
          🔵 مدیریت مودهای Bedrock
        </h2>

        <form id="bedrockForm">

          <input
            type="hidden"
            id="bedrockId"
          >

          <div class="grid">

            <div>
              <label>نام Add-on</label>

              <input
                id="bedrockName"
                type="text"
                placeholder="مثلاً Mega TNT +3v"
                required
              >
            </div>

            <div>
              <label>نسخه Minecraft</label>

              <input
                id="bedrockVersion"
                type="text"
                placeholder="مثلاً 1.21"
                required
              >
            </div>

            <div class="full">

              <label>لینک دانلود</label>

              <input
                id="bedrockDownload"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>
                فایل Add-on
                (.mcaddon / .mcpack / .zip)
              </label>

              <div class="file-box">

                <input
                  id="bedrockFile"
                  type="file"
                  accept=".mcaddon,.mcpack,.zip"
                >

                <div class="progress">
                  <div
                    id="bedrockProgressBar"class="progress-bar"
                  ></div>
                </div>

              </div>

            </div>

            <div class="full">

              <label>لینک تصویر</label>

              <input
                id="bedrockImage"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>توضیحات</label>

              <textarea
                id="bedrockDescription"
                placeholder="توضیحات Add-on..."
              ></textarea>

            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="btn-green"
              id="bedrockSubmitBtn"
            >
              افزودن Add-on
            </button>

            <button
              type="button"
              class="btn-gray hidden"
              id="bedrockCancelBtn"
            >
              لغو ویرایش
            </button>

          </div>

          <div
            id="bedrockStatus"
            class="status"
          ></div>

        </form>

        <div
          id="bedrockList"
          class="items"
          style="margin-top:25px"
        ></div>

      </section>


      <!-- NEWS -->
      <section class="section">

        <h2>
          📰 مدیریت اخبار
        </h2>

        <form id="newsForm">

          <input
            type="hidden"
            id="newsId"
          >

          <div class="grid">

            <div class="full">

              <label>عنوان خبر</label>

              <input
                id="newsTitle"
                type="text"
                placeholder="عنوان خبر"
                required
              >

            </div>

            <div class="full">

              <label>لینک تصویر</label>

              <input
                id="newsImage"
                type="url"
                placeholder="https://..."
              >

            </div>

            <div class="full">

              <label>متن خبر</label>

              <textarea
                id="newsContent"
                placeholder="متن کامل خبر..."
                required
              ></textarea>

            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="btn-green"
              id="newsSubmitBtn"
            >
              افزودن خبر
            </button>

            <button
              type="button"
              class="btn-gray hidden"
              id="newsCancelBtn"
            >
              لغو ویرایش

          <div

    </main>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <script>

    /* =========================
       CONFIG
    ========================= */

    const ADMIN_UID =
      "347c8443-089c-4f35-b8c5-7a10f9bafe3a";


    /* =========================
       ELEMENTS
    ========================= */

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const loginForm =
      document.getElementById("loginForm");

    const loginStatus =
      document.getElementById("loginStatus");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =========================
       SAFETY CHECK
    ========================= */

    if (!window.supabase) {

      document.body.innerHTML = `
        <div class="error-box">
          ❌ کتابخانه Supabase بارگذاری نشده است.<br><br>
          اتصال اینترنت و تگ CDN را بررسی کن.
        </div>
      `;

      throw new Error("Supabase library not loaded");
    }


    if (
      typeof supabaseClient === "undefined" ||
      !supabaseClient
    ) {

      document.body.innerHTML = `
        <div class="error-box">
          ❌ فایل supabase.js پیدا نشد یا اتصال Supabase ساخته نشده است.<br><br>
          مطمئن شو فایل <b>supabase.js</b> کنار admin.html قرار دارد.
        </div>
      `;

      throw new Error("supabaseClient not found");
    }


    /* =========================
       STATUS
    ========================= */

    function showStatus(
      element,
      message,
      type = "success"
    ) {

      element.textContent = message;

      element.className =
        "status show " + type;

    }


    function hideStatus(element) {

      element.className = "status";

      element.textContent = "";

    }


    /* =========================
       LOGIN PAGE
    ========================= */

    function showLogin() {

      loginPage.classList.remove("hidden");

      adminPage.classList.add("hidden");

    }


    function showAdmin() {

      loginPage.classList.add("hidden");

      adminPage.classList.remove("hidden");

      loadAll();

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;

        if (!email || !password) {

          showStatus(
            loginStatus,
            "ایمیل و رمز عبور را وارد کن.",
            "error"
          );

          return;
        }

        loginBtn.disabled = true;

        loginBtn.textContent =
          "در حال ورود...";

        hideStatus(loginStatus);

        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email,
                password
              });

          if (error) {

            console.error(
              "LOGIN ERROR:",
              error
            );

            showStatus(
              loginStatus,
              "ورود ناموفق بود: " +
              error.message,
              "error"
            );

            return;
          }

          if (!data || !data.user) {

            showStatus(
              loginStatus,
              "ورود انجام نشد.",
              "error"
            );

            return;
          }

          if (
            data.user.id !== ADMIN_UID
          ) {

            await supabaseClient.auth.signOut();

            showStatus(
              loginStatus,
              "این حساب دسترسی ادمین ندارد.",
              "error"
            );

            return;
          }

          showAdmin();

        } catch (error) {

          console.error(
            "LOGIN EXCEPTION:",
            error
          );

          showStatus(
            loginStatus,
            "خطای غیرمنتظره هنگام ورود: " +
            error.message,
            "error"
          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "ورود به پنل";

        }

      }
    );


    /* =========================
       LOGOUT
    ========================= */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        showLogin();

      }
    );


    /* =========================
       FILE UPLOAD
    ========================= */

    async function uploadFile(
      file,
      folder,
      progressBar
    ) {

      if (!file) {
        return null;
      }

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
          );

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 8) +"-" +
        safeName;

      const path =
        folder +
        "/" +
        fileName;

      progressBar.style.width =
        "30%";

      const {
        error
      } =
        await supabaseClient
          .storage
          .from("mods")
          .upload(
            path,
            file,
            {
              upsert: false
            }
          );

      if (error) {

        progressBar.style.width =
          "0%";

        throw error;
      }

      progressBar.style.width =
        "100%";

      const {
        data
      } =
        supabaseClient
          .storage
          .from("mods")
          .getPublicUrl(path);

      return data.publicUrl;

    }


    /* =========================
       JAVA FORM
    ========================= */

    const javaForm =
      document.getElementById("javaForm");

    const javaCancelBtn =
      document.getElementById("javaCancelBtn");

    javaForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const status =
          document.getElementById(
            "javaStatus"
          );

        try {

          const id =
            document.getElementById(
              "javaId"
            ).value;

          const name =
            document.getElementById(
              "javaName"
            ).value.trim();

          const minecraft_version =
            document.getElementById(
              "javaVersion"
            ).value.trim();

          const loader =
            document.getElementById(
              "javaLoader"
            ).value;

          let download_url =
            document.getElementById(
              "javaDownload"
            ).value.trim();

          const description =
            document.getElementById(
              "javaDescription"
            ).value.trim();

          const image_url =
            document.getElementById(
              "javaImage"
            ).value.trim();

          const file =
            document.getElementById(
              "javaFile"
            ).files[0];

          showStatus(
            status,
            "در حال ذخیره...",
            "success"
          );

          if (file) {

            if (
              !file.name
                .toLowerCase()
                .endsWith(".jar")
            ) {

              throw new Error(
                "فایل Java باید با فرمت .jar باشد."
              );

            }

            download_url =
              await uploadFile(
                file,
                "java",
                document.getElementById(
                  "javaProgressBar"
                )
              );

          }

          if (!download_url) {

            throw new Error(
              "لینک دانلود یا فایل مود را وارد کن."
            );

          }

          const payload = {
            name,
            minecraft_version,
            loader: loader || null,
            download_url,
            description: description || null,
            image_url: image_url || null
          };


          let result;

          if (id) {

            result =
              await supabaseClient
                .from("java_mods")
                .update(payload)
                .eq("id", id);

          } else {

            result =
              await supabaseClient
                .from("java_mods")
                .insert(payload);

          }

          if (result.error) {
            throw result.error;
          }

          showStatus(
            status,
            id
              ? "مود Java با موفقیت ویرایش شد."
              : "مود Java با موفقیت اضافه شد.",
            "success"
          );

          resetJavaForm();

          loadJava();

        } catch (error) {

          console.error(
            "JAVA ERROR:",
            error
          );

          showStatus(
            status,
            "خطا: " + error.message,
            "error"
          );

        }

      }
    );


    function resetJavaForm() {

      javaForm.reset();

      document.getElementById("javaId"
      ).value = "";

      document.getElementById(
        "javaProgressBar"
      ).style.width = "0%";

      document.getElementById(
        "javaSubmitBtn"
      ).textContent =
        "افزودن مود Java";

      javaCancelBtn.classList.add(
        "hidden"
      );

    bedrockForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const status =
          document.getElementById(
            "bedrockStatus"
          );

        try {

          const id =
            document.getElementById(
              "bedrockId"
            ).value;

          const name =
            document.getElementById(
              "bedrockName"
            ).value.trim();

          const minecraft_version =
            document.getElementById(
              "bedrockVersion"
            ).value.trim();

          let download_url =
            document.getElementById(
              "bedrockDownload"
            ).value.trim();

          const description =
            document.getElementById(
              "bedrockDescription"
            ).value.trim();

          const image_url =
            document.getElementById(
              "bedrockImage"
            ).value.trim();

          const file =
            document.getElementById(
              "bedrockFile"
            ).files[0];

          showStatus(
            status,
            "در حال ذخیره...",
            "success"
          );


          if (file) {

            const lower =
              file.name.toLowerCase();

            const valid =
              lower.endsWith(".mcaddon") ||
              lower.endsWith(".mcpack") ||
              lower.endsWith(".zip");

            if (!valid) {

              throw new Error(
                "فایل Bedrock باید .mcaddon یا .mcpack یا .zip باشد."
              );

            }

            download_url =
              await uploadFile(
                file,
                "bedrock",
                document.getElementById(
                  "bedrockProgressBar"
                )
              );

          }


          if (!download_url) {

            throw new Error(
              "لینک دانلود یا فایل Add-on را وارد کن."
            );

          }


          const payload = {
            name,
            minecraft_version,
            download_url,
            description: description || null,
            image_url: image_url || null
          };


          let result;

          if (id) {

            result =
              await supabaseClient
                .from("bedrock_mods")
                .update(payload)
                .eq("id", id);

          } else {

            result =
              await supabaseClient
                .from("bedrock_mods")
                .insert(payload);

          }


          if (result.error) {
            throw result.error;
          }


          showStatus(
            status,
            id
              ? "Add-on با موفقیت ویرایش شد."
              : "Add-on با موفقیت اضافه شد.",
            "success"
          );

          resetBedrockForm();

          loadBedrock();

        } catch (error) {

          console.error(
            "BEDROCK ERROR:",
            error
          );

          showStatus(
            status,
            "خطا: " + error.message,
            "error"
          );

        }

      }
    );

    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      if (value === null ||
          value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       AUTH CHECK
    ========================= */

    async function checkAuth() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(
            "SESSION ERROR:",
            error
          );

          showLogin();

          return;
        }


        const session =
          data.session;


        if (!session) {

          showLogin();

          return;
        }


        if (
          session.user.id !== ADMIN_UID
        ) {

          await supabaseClient.auth
            .signOut();

          showLogin();

          showStatus(
            loginStatus,
            "این حساب ادمین نیست.",
            "error"
          );

          return;
        }


        showAdmin();

      } catch (error) {

        console.error(
          "AUTH CHECK ERROR:",
          error
        );

        showLogin();

      }

    }


    /* =========================
       AUTH STATE
    ========================= */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        console.log(
          "AUTH EVENT:",
          event
        );


        if (!session) {

          showLogin();

          return;
        }


        if (
          session.user.id !== ADMIN_UID
        ) {

          showLogin();

          return;
        }


        showAdmin();

      }
    );


    /* =========================
